name: Symfony Agent Validation Gates

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  DATABASE_URL: "postgresql://symfony_user:symfony_pass@127.0.0.1:5432/symfony_test?serverVersion=16&charset=utf8"

jobs:
  # ============================================================================
  # Gate 0: Agent Ecosystem & Template Integrity
  # Always runs across agent ecosystem repos and downstream projects
  # ============================================================================
  ecosystem-integrity:
    name: "Agent Ecosystem Integrity & Contracts"
    runs-on: ubuntu-latest
    outputs:
      has_composer: ${{ steps.check_composer.outputs.has_composer }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate PHP Syntax in Templates
        run: |
          find templates -name "*.php" -exec php -l {} \;

      - name: Validate OpenAPI 3.1 Contract Specification
        run: |
          php templates/contracts/openapi-validator.php templates/contracts/openapi.json.dist --strict

      - name: Test CLI Benchmark Runner Help
        run: |
          php templates/benchmarks/benchmark-runner.php --help

      - name: Test CLI Contract Validator Help
        run: |
          php templates/contracts/openapi-validator.php --help

      - name: Test CLI Mutation Runner Help
        run: |
          php templates/testing/mutation-runner.php --help

      - name: Test CLI Architectural Validator Help
        run: |
          php templates/architecture/architecture-validator.php --help

      - name: Validate Plugin Manifest JSON
        run: |
          jq empty plugin.json

      - name: Validate Shell Installer Syntax
        run: |
          bash -n install.sh

      - name: Verify All 20 Agents and 20 Base Skills
        run: |
          AGENT_COUNT=$(ls -1 agents/*.md | wc -l)
          SKILL_COUNT=$(ls -d skills/*/ | wc -l)
          echo "Verified ${AGENT_COUNT} agent files and ${SKILL_COUNT} skills."
          if [ "${AGENT_COUNT}" -lt 20 ]; then
            echo "Error: Expected at least 20 agents, found ${AGENT_COUNT}"
            exit 1
          fi

      - id: check_composer
        name: Check For Symfony Application Composer Configuration
        run: |
          if [ -f "composer.json" ]; then
            echo "has_composer=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_composer=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # Gate 1: Lint & Container Integrity (Runs on Symfony Applications)
  # ============================================================================
  lint-and-container:
    name: "Lint & Container Integrity"
    runs-on: ubuntu-latest
    needs: ecosystem-integrity
    if: needs.ecosystem-integrity.outputs.has_composer == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo, pdo_pgsql, xml, ctype, iconv
          coverage: none

      - name: Validate Composer Configuration
        run: composer validate --strict

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint Symfony DI Container
        run: php bin/console lint:container --no-debug

      - name: Lint YAML Configuration
        run: php bin/console lint:yaml config --parse-tags

      - name: Lint Twig Templates
        run: |
          if [ -d "templates" ]; then
            php bin/console lint:twig templates
          else
            echo "No templates directory found, skipping Twig lint."
          fi

  # ============================================================================
  # Gate 2: Security Vulnerability Audit (Runs on Symfony Applications)
  # ============================================================================
  security-audit:
    name: "Security Audit (OWASP / CVEs)"
    runs-on: ubuntu-latest
    needs: ecosystem-integrity
    if: needs.ecosystem-integrity.outputs.has_composer == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Audit Composer Dependencies for Known CVEs
        run: composer audit

  # ============================================================================
  # Gate 3: Static Analysis (Runs on Symfony Applications)
  # ============================================================================
  static-analysis:
    name: "PHPStan Static Analysis (Level 8+)"
    runs-on: ubuntu-latest
    needs: ecosystem-integrity
    if: needs.ecosystem-integrity.outputs.has_composer == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo, pdo_pgsql, xml, ctype, iconv
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan Analysis
        run: |
          if [ -f "vendor/bin/phpstan" ]; then
            vendor/bin/phpstan analyse --error-format=github
          elif [ -f "bin/phpstan" ]; then
            bin/phpstan analyse --error-format=github
          else
            echo "PHPStan binary not found; skipping."
          fi

  # ============================================================================
  # Gate 4 & 5: Database Schema & Automated Tests (Runs on Symfony Applications)
  # ============================================================================
  database-and-tests:
    name: "Database Schema & PHPUnit Tests"
    runs-on: ubuntu-latest
    needs: ecosystem-integrity
    if: needs.ecosystem-integrity.outputs.has_composer == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: symfony_test
          POSTGRES_USER: symfony_user
          POSTGRES_PASSWORD: symfony_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo, pdo_pgsql, xml, ctype, iconv
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php-version }}-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Validate Doctrine ORM Mapping
        run: php bin/console doctrine:schema:validate --skip-sync

      - name: Prepare Test Database & Run Migrations
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Validate Doctrine Schema Synchronization
        run: php bin/console doctrine:schema:validate --env=test

      - name: Validate OpenAPI Contract Specification
        run: |
          if [ -f "templates/contracts/openapi-validator.php" ]; then
            php templates/contracts/openapi-validator.php --strict
          elif [ -f ".agents/templates/contracts/openapi-validator.php" ]; then
            php .agents/templates/contracts/openapi-validator.php --strict
          fi

      - name: Validate Architectural Boundaries (Deptrac)
        run: |
          if [ -f "templates/architecture/architecture-validator.php" ]; then
            php templates/architecture/architecture-validator.php --strict
          elif [ -f ".agents/templates/architecture/architecture-validator.php" ]; then
            php .agents/templates/architecture/architecture-validator.php --strict
          fi

      - name: Execute Automated Test Suite (PHPUnit)
        run: |
          if [ -f "bin/phpunit" ]; then
            php bin/phpunit --testdox
          elif [ -f "vendor/bin/phpunit" ]; then
            vendor/bin/phpunit --testdox
          else
            echo "PHPUnit binary not found; skipping."
          fi
