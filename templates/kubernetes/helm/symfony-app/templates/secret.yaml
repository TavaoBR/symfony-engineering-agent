apiVersion: v1
kind: Secret
metadata:
  name: {{ include "symfony-app.fullname" . }}-secret
  labels:
    {{- include "symfony-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_SECRET: {{ .Values.secrets.appSecret | quote }}
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  DB_HOST: {{ .Values.secrets.dbHost | quote }}
  DB_NAME: {{ .Values.secrets.dbName | quote }}
